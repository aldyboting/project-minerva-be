name = "minerva-keep-warm"
main = "worker.js"
compatibility_date = "2026-08-13"

# Keep the Render free web service awake for the 19:00 reminder cron
# (17:45-20:00) and for morning users (09:00-12:00). ~163h/month awake,
# well under Render's 750 free instance-hours cap.
[triggers]
crons = ["*/5 9-11,18-19 * * *", "45-59/5 17 * * *"]

# Mentorship copy: keeps minerva-be-mentorship.onrender.com awake.
# Deploy with: bunx wrangler deploy --env mentorship
# Cron times are UTC. 23:00-15:59 UTC is 06:00-22:59 WIB.
# 18:00 UTC keeps the 19:00 UTC reminder cron awake.
# About 18 hours a day, about 570 hours a month. Render's 750-hour
# allowance is shared with other free services in the same workspace.
[env.mentorship]
name = "minerva-mentorship-keep-warm"

[env.mentorship.vars]
PING_URL = "https://minerva-be-mentorship.onrender.com/api/health"

[env.mentorship.triggers]
crons = ["*/5 0-15,18,23 * * *"]

[env.mentorship.observability]
enabled = true
head_sampling_rate = 1
